<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="./">
<title>Random Episodes</title>

<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="./static/main.css">

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="apple-touch-icon" sizes="180x180" href="./static/icon-180.png" />
<link rel="icon" type="image/png" sizes="32x32" href="./static/icon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="./static/icon-16.png" />
<link rel="manifest" href="./static/manifest.json" crossorigin="use-credentials" />
</head>
<body>
<div class="mt-3 p-3 container app-container">
    <!-- TODO Drop down arrow to select num of episodes -->
    <div class="text-center">
        <h2>Random Episode Player</h2>

        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <div class="pb-3">
            <!-- TODO Browse Videos in order to watch in chrome browser -->
            {% for show in shows %}
            <button type="button" class="btn-lg btn-primary show">{{ show }}</button>
            {% endfor %}
        </div>
        <div class="pb-3">
            <label for="episodeCount">Number of Episodes: <span class="episodeCount" aria-live="polite"></span></label>
            <div class="d-flex justify-content-center">
                <input type="range" id="episodeCount" class="w-50 form-control-range episodeCount episode-count" min="1" max="8" value="5">
            </div>
        </div>
        <div class="pb-3">
            <button type="button" class="btn-lg btn-danger stop">Stop</button>
        </div>
        <div class="pb-3">
            <button type="button" value="1" class="btn-lg btn-info volume" aria-label="Volume down"><i class="material-icons" aria-hidden="true">volume_down</i></button>
            <button type="button" value="50" class="btn-lg btn-info volume" aria-label="Volume 50 percent">50%</button>
            <button type="button" value="2" class="btn-lg btn-info volume" aria-label="Volume up"><i class="material-icons" aria-hidden="true">volume_up</i></button>
        </div>
        <div class="pb-3">
            <div class="btn-group" role="group" aria-label="Select Chromecast device">
                {% for device in devices %}
                <button type="button" class="btn btn-secondary device">{{ device }}</button>
                {% endfor %}
            </div>
        </div>
        <div class="pb-3">
            <span id="status" role="status" aria-live="polite"></span>
        </div>
    </div>
</div>

<script src="./static/main.js"></script>
</body>
</html>
